<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Gesture Calculator — CGIP</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(15, 22, 38, 0.92);
      --border: rgba(0, 242, 254, 0.22);
      --accent: #00f2fe;
      --accent2: #4facfe;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ff4b72;
      --warn: #f59e0b;
      --success: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', 'Segoe UI', system-ui, monospace; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 80% 10%, #111a2e, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Top Header (46px fixed) */
    header {
      height: 46px;
      min-height: 46px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; color: #050811; font-weight: 800;
    }
    .logo-text {
      font-weight: 700; font-size: 0.95rem; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .pill-status {
      font-size: 0.72rem; padding: 3px 10px; border-radius: 999px;
      background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.35);
      color: var(--success);
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .telemetry-pill {
      font-size: 0.75rem; padding: 5px 12px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1; display: flex; gap: 10px;
    }
    .telemetry-pill span b { color: var(--accent); }
    .icon-btn {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.12);
      color: var(--accent); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    }
    .cam-master-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #050811; font-weight: 700; border: none; padding: 6px 14px;
      border-radius: 8px; cursor: pointer; font-size: 0.78rem;
    }

    /* Main 2-Column Workspace — Equal Full Height */
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 14px;
      padding: 12px 16px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Both columns match exact 100% height of main */
    .col-panel {
      height: 100%;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* Left Column: Full-Height Camera Container (matches Calculator height 100%) */
    .cam-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #04070e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    video { display: none; }
    #output_canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    /* Optional Interactive Swipe & Digit Pad Overlay inside Camera Viewport */
    #gesture_pad {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      touch-action: none;
    }
    #gesture_pad.active-pad {
      pointer-events: auto;
      background: rgba(7, 11, 20, 0.72);
      cursor: crosshair;
    }

    /* Camera Top Controls */
    .cam-top-bar {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex; gap: 8px; flex-wrap: wrap;
      z-index: 6;
    }
    .hud-btn {
      background: rgba(10, 15, 28, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.74rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: 0.15s;
    }
    .hud-btn:hover, .hud-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 242, 254, 0.14);
    }
    .hud-tag {
      background: rgba(10, 15, 28, 0.85);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.74rem;
    }
    .hud-tag b { color: var(--success); }

    /* Hold Progress Bar (3.0s Air Gesture Timer) */
    .hold-progress-wrap {
      position: absolute;
      top: 46px; left: 10px; right: 10px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .hold-progress-wrap.visible { opacity: 1; }
    .hold-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.05s linear;
    }

    /* Camera Bottom HUD Legend & Status */
    .cam-bottom-hud {
      position: absolute;
      bottom: 10px; left: 10px; right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 6;
      pointer-events: none;
    }
    .gesture-legend {
      background: rgba(8, 12, 22, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.73rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      backdrop-filter: blur(6px);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .metric-box {
      background: rgba(8, 12, 22, 0.88);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.74rem;
      color: #cbd5e1;
    }
    .metric-box b { color: var(--accent); }
    .detect-badge {
      background: rgba(0, 242, 254, 0.16);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Right Column: Full-Height Calculator */
    .calc-col {
      gap: 10px;
    }
    .display-screen {
      height: 92px;
      min-height: 92px;
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .disp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .deg-badge {
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 242, 254, 0.25);
      cursor: pointer;
    }
    .expr-line {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .res-line {
      font-size: 1.95rem;
      font-weight: 800;
      color: #ffffff;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scientific Row */
    .sci-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      height: 36px;
      min-height: 36px;
    }
    .sci-key {
      background: rgba(23, 29, 52, 0.75);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 8px;
      color: #c4b5fd;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }
    .sci-key:hover, .sci-key.hovered {
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    /* Main 4x5 Keypad Grid */
    .keypad-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 9px;
    }
    .key {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }
    .key:hover, .key.hovered {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
      transform: translateY(-1px);
    }
    .key.ac { background: rgba(88, 28, 45, 0.65); color: #fda4af; border-color: rgba(255, 75, 114, 0.3); }
    .key.del { background: rgba(78, 56, 24, 0.65); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
    .key.op { background: rgba(14, 34, 58, 0.8); color: var(--accent); border-color: rgba(0, 242, 254, 0.2); }
    .key.eq {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #040811;
      font-size: 1.3rem;
      font-weight: 800;
    }

    /* Spatial Hand Cursor */
    #cursor {
      position: fixed;
      width: 24px; height: 24px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
      box-shadow: 0 0 12px var(--accent);
    }
    #cursor.pinching {
      background: var(--accent);
      width: 16px; height: 16px;
    }
  </style>
</head>
<body>
  <div id="cursor"></div>

  <header>
    <div class="brand">
      <div class="logo-icon">✋</div>
      <div class="logo-text">SPATIAL GESTURE CALCULATOR</div>
      <span class="pill-status">● 2-HAND TRACKING (3S HOLD)</span>
    </div>
    <div class="header-right">
      <div class="telemetry-pill">
        <span>PINCH: <b id="top_pinch">0.00</b></span>
        <span>|</span>
        <span>FINGERS: <b id="top_fingers">0</b></span>
        <span>|</span>
        <span id="fps_out">60 FPS</span>
      </div>
      <button class="icon-btn" id="mute_btn" title="Toggle Sound">🔊</button>
      <button class="cam-master-btn" id="master_cam_btn">📷 Start Camera</button>
    </div>
  </header>

  <main>
    <!-- Left Column: Full-Length Camera Feed (Same height as Calculator) -->
    <section class="col-panel">
      <div class="cam-viewport">
        <video id="input_video" playsinline></video>
        <canvas id="output_canvas" width="960" height="720"></canvas>
        <canvas id="gesture_pad"></canvas>

        <div class="cam-top-bar">
          <button class="hud-btn" id="cam_toggle_btn">⏻ Start Camera</button>
          <button class="hud-btn active" id="air_mode_btn">Air Gestures (0-10 & Ops): ON</button>
          <button class="hud-btn" id="draw_overlay_btn">✍ Draw / Swipe Pad: OFF</button>
          <span class="hud-tag">Keypad Click: <b>Pinch / Tap Only</b></span>
        </div>

        <div class="hold-progress-wrap" id="hold_wrap">
          <div class="hold-progress-bar" id="hold_bar"></div>
        </div>

        <div class="cam-bottom-hud">
          <div class="gesture-legend">
            <span><b>0-10:</b> ✊=0, 1-5 (1H), 6-10 (2H)</span>
            <span>👍<b>+</b> &nbsp; 🤙<b>−</b> &nbsp; 🤘<b>×</b> &nbsp; 👆(L)<b>÷</b> &nbsp; 🤟<b>=</b></span>
          </div>
          <div class="status-row">
            <div class="metric-box">
              HANDS: <b id="hud_hands">0</b> &nbsp;|&nbsp; FINGERS: <b id="hud_fingers">0</b> &nbsp;|&nbsp; PINCH: <b id="hud_pinch">0.00</b>
            </div>
            <div class="detect-badge" id="detect_badge">CAMERA STANDBY</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column: Full-Length Calculator (Same height as Camera) -->
    <section class="col-panel calc-col">
      <div class="display-screen">
        <div class="disp-top">
          <div>
            <span class="deg-badge" id="deg_btn">DEG</span>
            <span id="last_gesture_lbl" style="margin-left:8px; color:#00f2fe;">Air Gesture: Ready</span>
          </div>
          <div class="expr-line" id="expr_out">0</div>
        </div>
        <div class="res-line" id="res_out">0</div>
      </div>

      <div class="sci-grid">
        <button class="sci-key key-target" data-val="sin">sin</button>
        <button class="sci-key key-target" data-val="cos">cos</button>
        <button class="sci-key key-target" data-val="sqrt">√x</button>
        <button class="sci-key key-target" data-val="sq">x²</button>
        <button class="sci-key key-target" data-val="%">%</button>
      </div>

      <div class="keypad-grid">
        <button class="key ac key-target" data-val="AC">AC</button>
        <button class="key del key-target" data-val="DEL">⌫</button>
        <button class="key op key-target" data-val="()">( )</button>
        <button class="key op key-target" data-val="/">÷</button>

        <button class="key key-target" data-val="7">7</button>
        <button class="key key-target" data-val="8">8</button>
        <button class="key key-target" data-val="9">9</button>
        <button class="key op key-target" data-val="*">×</button>

        <button class="key key-target" data-val="4">4</button>
        <button class="key key-target" data-val="5">5</button>
        <button class="key key-target" data-val="6">6</button>
        <button class="key op key-target" data-val="-">−</button>

        <button class="key key-target" data-val="1">1</button>
        <button class="key key-target" data-val="2">2</button>
        <button class="key key-target" data-val="3">3</button>
        <button class="key op key-target" data-val="+">+</button>

        <button class="key key-target" data-val="+-">±</button>
        <button class="key key-target" data-val="0">0</button>
        <button class="key key-target" data-val=".">.</button>
        <button class="key eq key-target" data-val="=">=</button>
      </div>
    </section>
  </main>

  <script>
    let expr = "";
    let isDeg = true;
    let soundOn = true;

    const exprOut = document.getElementById("expr_out");
    const resOut = document.getElementById("res_out");
    const lastGestureLbl = document.getElementById("last_gesture_lbl");
    const detectBadge = document.getElementById("detect_badge");
    const holdWrap = document.getElementById("hold_wrap");
    const holdBar = document.getElementById("hold_bar");

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 520, dur = 0.065) {
      if (!soundOn) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    document.getElementById("mute_btn").addEventListener("click", e => {
      soundOn = !soundOn;
      e.target.textContent = soundOn ? "🔊" : "🔇";
    });

    document.getElementById("deg_btn").addEventListener("click", e => {
      isDeg = !isDeg;
      e.target.textContent = isDeg ? "DEG" : "RAD";
    });

    function evaluateExpr(raw) {
      const clean = raw.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
      const val = Function('"use strict";return (' + (clean || "0") + ')')();
      return Number.isFinite(val) ? +val.toFixed(6) : "Error";
    }

    function handleInput(val, source = "Key") {
      beep(val === "=" ? 780 : 480, 0.07);
      if (val === "AC") {
        expr = "";
        resOut.textContent = "0";
      } else if (val === "DEL") {
        expr = expr.slice(0, -1);
      } else if (val === "+-") {
        if (expr.startsWith("-")) expr = expr.slice(1);
        else if (expr) expr = "-" + expr;
      } else if (val === "()") {
        const open = (expr.match(/\(/g) || []).length;
        const close = (expr.match(/\)/g) || []).length;
        expr += open > close ? ")" : "(";
      } else if (["sin", "cos", "sqrt", "sq"].includes(val)) {
        try {
          const cur = Number(evaluateExpr(expr || resOut.textContent || "0"));
          let out = 0;
          if (val === "sin") out = Math.sin(isDeg ? (cur * Math.PI) / 180 : cur);
          if (val === "cos") out = Math.cos(isDeg ? (cur * Math.PI) / 180 : cur);
          if (val === "sqrt") out = Math.sqrt(cur);
          if (val === "sq") out = cur * cur;
          resOut.textContent = Number.isFinite(out) ? +out.toFixed(6) : "Error";
          expr = String(resOut.textContent);
        } catch {
          resOut.textContent = "Error";
        }
      } else if (val === "=") {
        try {
          resOut.textContent = evaluateExpr(expr);
          expr = String(resOut.textContent === "Error" ? "" : resOut.textContent);
        } catch {
          resOut.textContent = "Error";
        }
      } else {
        expr += val;
        try {
          resOut.textContent = evaluateExpr(expr);
        } catch {
          resOut.textContent = expr;
        }
      }
      exprOut.textContent = expr || "0";
      lastGestureLbl.textContent = `${source}: ${val}`;
    }

    document.querySelectorAll(".key-target").forEach(btn => {
      btn.addEventListener("click", () => handleInput(btn.dataset.val, "Tap"));
    });

    // Optional Draw/Swipe Overlay inside Camera Viewport
    const pad = document.getElementById("gesture_pad");
    const pctx = pad.getContext("2d");
    let drawMode = false, pts = [], drawing = false, lastTap = 0;

    function syncPadSize() {
      pad.width = pad.clientWidth;
      pad.height = pad.clientHeight;
    }
    window.addEventListener("resize", syncPadSize);
    syncPadSize();

    document.getElementById("draw_overlay_btn").addEventListener("click", e => {
      drawMode = !drawMode;
      pad.classList.toggle("active-pad", drawMode);
      e.target.classList.toggle("active", drawMode);
      e.target.textContent = `✍ Draw / Swipe Pad: ${drawMode ? "ON" : "OFF"}`;
      syncPadSize();
    });

    pad.addEventListener("pointerdown", e => {
      if (!drawMode) return;
      const now = Date.now();
      if (now - lastTap < 280) {
        handleInput("=", "Double-Tap");
        return;
      }
      lastTap = now;
      drawing = true;
      pts = [{ x: e.offsetX, y: e.offsetY }];
      pctx.clearRect(0, 0, pad.width, pad.height);
    });

    pad.addEventListener("pointermove", e => {
      if (!drawing) return;
      pts.push({ x: e.offsetX, y: e.offsetY });
      pctx.strokeStyle = "#00f2fe";
      pctx.lineWidth = 4;
      pctx.lineCap = "round";
      pctx.beginPath();
      pctx.moveTo(pts[pts.length - 2].x, pts[pts.length - 2].y);
      pctx.lineTo(e.offsetX, e.offsetY);
      pctx.stroke();
    });

    pad.addEventListener("pointerup", () => {
      if (!drawing) return;
      drawing = false;
      if (pts.length < 5) return;
      const s = pts[0], end = pts[pts.length - 1];
      const dx = end.x - s.x, dy = end.y - s.y;
      const dist = Math.hypot(dx, dy);
      let len = 0;
      for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);

      if (len > 180 && dist < 55) handleInput("AC", "Loop");
      else if (dist > 45) {
        if (Math.abs(dx) > Math.abs(dy)) handleInput(dx > 0 ? "*" : "/", "Swipe");
        else handleInput(dy < 0 ? "+" : "-", "Swipe");
      }
      setTimeout(() => pctx.clearRect(0, 0, pad.width, pad.height), 300);
    });

    // MediaPipe 2-Hand Tracking (0-10 Fingers + Operator Poses + 3.0s Hold + Pinch Click Only)
    const videoEl = document.getElementById("input_video");
    const canvasEl = document.getElementById("output_canvas");
    const ctx = canvasEl.getContext("2d");
    const cursor = document.getElementById("cursor");

    let cameraObj = null;
    let camRunning = false;
    let airGesturesOn = true;
    let pinchLock = false;

    const HOLD_DURATION_MS = 3000;
    let candidateGesture = null;
    let candidateStart = 0;

    document.getElementById("air_mode_btn").addEventListener("click", e => {
      airGesturesOn = !airGesturesOn;
      e.target.classList.toggle("active", airGesturesOn);
      e.target.textContent = `Air Gestures (0-10 & Ops): ${airGesturesOn ? "ON" : "OFF"}`;
      holdWrap.classList.remove("visible");
    });

    function analyzeSingleHand(lm, handednessLabel) {
      // Thumb openness based on horizontal distance from thumb tip (4) to index MCP (5)
      const thumbExt = Math.hypot(lm[4].x - lm[5].x, lm[4].y - lm[5].y) > 0.11 && lm[4].y < lm[2].y + 0.04;
      const idxExt = lm[8].y < lm[6].y;
      const midExt = lm[12].y < lm[10].y;
      const rngExt = lm[16].y < lm[14].y;
      const pkyExt = lm[20].y < lm[18].y;

      const count = (thumbExt ? 1 : 0) + (idxExt ? 1 : 0) + (midExt ? 1 : 0) + (rngExt ? 1 : 0) + (pkyExt ? 1 : 0);

      // Operator special poses on single hand
      let poseOp = null;
      if (thumbExt && !idxExt && !midExt && !rngExt && !pkyExt) poseOp = "+"; // Thumbs Up
      else if (thumbExt && !idxExt && !midExt && !rngExt && pkyExt) poseOp = "-"; // Shaka
      else if (!thumbExt && idxExt && !midExt && !rngExt && pkyExt) poseOp = "*"; // Rock Horns
      else if (thumbExt && idxExt && !midExt && !rngExt && !pkyExt) poseOp = "/"; // L-Shape
      else if (thumbExt && idxExt && !midExt && !rngExt && pkyExt) poseOp = "="; // ILY

      return { count, poseOp };
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    let lastFrameTime = performance.now();
    hands.onResults(results => {
      const now = performance.now();
      const fps = Math.round(1000 / Math.max(16, now - lastFrameTime));
      lastFrameTime = now;
      document.getElementById("fps_out").textContent = `${fps} FPS`;

      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      const handList = results.multiHandLandmarks || [];
      document.getElementById("hud_hands").textContent = handList.length;

      if (handList.length === 0) {
        cursor.style.display = "none";
        detectBadge.textContent = "NO HAND DETECTED";
        holdWrap.classList.remove("visible");
        candidateGesture = null;
        return;
      }

      // Draw landmarks
      handList.forEach(lm => {
        ctx.fillStyle = "#00f2fe";
        for (const pt of lm) {
          ctx.beginPath();
          ctx.arc(pt.x * canvasEl.width, pt.y * canvasEl.height, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Primary hand for spatial cursor & pinch click
      const primary = handList[0];
      const idx = primary[8], thm = primary[4];
      const pinchDist = Math.hypot(idx.x - thm.x, idx.y - thm.y);

      document.getElementById("top_pinch").textContent = pinchDist.toFixed(2);
      document.getElementById("hud_pinch").textContent = pinchDist.toFixed(2);

      const sx = (1 - idx.x) * window.innerWidth;
      const sy = idx.y * window.innerHeight;
      cursor.style.display = "block";
      cursor.style.left = `${sx}px`;
      cursor.style.top = `${sy}px`;

      document.querySelectorAll(".key-target").forEach(k => k.classList.remove("hovered"));
      const hoveredEl = document.elementFromPoint(sx, sy);
      const onButton = hoveredEl && hoveredEl.classList.contains("key-target");

      if (onButton) {
        hoveredEl.classList.add("hovered");
        // Intentional Pinch-to-Click ONLY (No hover auto-click)
        if (pinchDist < 0.05 && !pinchLock) {
          pinchLock = true;
          cursor.classList.add("pinching");
          handleInput(hoveredEl.dataset.val, "Pinch");
          setTimeout(() => {
            pinchLock = false;
            cursor.classList.remove("pinching");
          }, 550);
        }
      }

      // Evaluate 0-10 fingers or Operator pose across 1 or 2 hands
      let totalFingers = 0;
      let detectedPose = null;

      handList.forEach((lm, i) => {
        const info = analyzeSingleHand(lm, i);
        totalFingers += info.count;
        if (handList.length === 1 && info.poseOp) {
          detectedPose = info.poseOp;
        }
      });

      document.getElementById("top_fingers").textContent = totalFingers;
      document.getElementById("hud_fingers").textContent = totalFingers;

      const activeSymbol = detectedPose ? detectedPose : String(totalFingers);
      detectBadge.textContent = detectedPose ? `POSE: ${detectedPose}` : `NUMBER: ${totalFingers}`;

      if (airGesturesOn && !onButton) {
        if (candidateGesture !== activeSymbol) {
          candidateGesture = activeSymbol;
          candidateStart = now;
          holdBar.style.width = "0%";
          holdWrap.classList.add("visible");
        } else {
          const elapsed = now - candidateStart;
          const pct = Math.min(100, (elapsed / HOLD_DURATION_MS) * 100);
          holdBar.style.width = `${pct}%`;
          detectBadge.textContent = `HOLD ${activeSymbol} (${((HOLD_DURATION_MS - elapsed) / 1000).toFixed(1)}s)`;

          if (elapsed >= HOLD_DURATION_MS) {
            handleInput(activeSymbol, "Air Gesture");
            candidateStart = now + 900; // brief cooldown before next trigger
            holdBar.style.width = "0%";
          }
        }
      } else {
        holdWrap.classList.remove("visible");
        candidateGesture = null;
      }
    });

    async function toggleCamera() {
      const btn1 = document.getElementById("master_cam_btn");
      const btn2 = document.getElementById("cam_toggle_btn");
      if (!camRunning) {
        camRunning = true;
        btn1.textContent = "⏹ Stop Camera";
        btn2.textContent = "⏻ Stop Camera";
        btn2.classList.add("active");
        cameraObj = new Camera(videoEl, {
          onFrame: async () => {
            if (camRunning) await hands.send({ image: videoEl });
          },
          width: 960,
          height: 720
        });
        await cameraObj.start();
      } else {
        camRunning = false;
        if (cameraObj && cameraObj.stop) cameraObj.stop();
        btn1.textContent = "📷 Start Camera";
        btn2.textContent = "⏻ Start Camera";
        btn2.classList.remove("active");
        detectBadge.textContent = "CAMERA STOPPED";
      }
    }

    document.getElementById("master_cam_btn").addEventListener("click", toggleCamera);
    document.getElementById("cam_toggle_btn").addEventListener("click", toggleCamera);
  </script>
</body>
</html>
